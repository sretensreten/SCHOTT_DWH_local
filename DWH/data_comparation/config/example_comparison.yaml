provider: bigquery
comparison_mode: keyed
comparison_name: example_comparison
description: Replace objects and keys with real values.
project_env: GCP_PROJECT_ID
connection:
  env_file: .env
left:
  namespace: pro_pharma
  object: source_table
right:
  namespace: pro_pharma
  object: target_table
join_keys:
  - event_date
  - business_key
columns:
  mode: all_common
  include: []
  exclude:
    - load_timestamp
filters:
  left: []
  right: []
date_filter:
  left_field: event_date
  right_field: event_date
  from: '2026-01-01'
  to: '2026-01-31'
comparison_options:
  numeric_tolerance:
    mode: absolute
    value: 0.001
  strings:
    trim: false
    case_sensitive: true
    empty_string_equals_null: false
  sample:
    max_problem_rows: 10
  values:
    show_values: true
    mask_sensitive_values: false
execution:
  query_timeout_seconds: 900
provider_options:
  dry_run_before_execute: true
  maximum_bytes_billed_gb: 25
  stop_if_dry_run_exceeds_limit: true
tags:
  - validation
