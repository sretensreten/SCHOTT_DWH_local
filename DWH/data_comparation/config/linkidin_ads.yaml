provider: bigquery
comparison_mode: keyed
comparison_name: linkidin_ads
description: Compare int_core.dev_int_core__linkedin_ads_campaign_performance_legacy_for_comparation_delete_after_use
  with PMU_KPI_Cockpit.LinkedIn_Ads_Cost_Data_AGG
project_env: GCP_PROJECT_ID
connection:
  env_file: .env
left:
  namespace: audit
  object: dev_audit__linkedin_ads__legacy_aligned
right:
  namespace: audit
  object: dev_audit__linkedin_ads__refactor_aligned
join_keys:
- business_unit
- campaign_group_name
- campaign_name
- event_date
- market_region
- sbf
columns:
  mode: all_common
  include: []
  exclude: []
filters:
  left: []
  right: []
date_filter:
  left_field: event_date
  right_field: event_date
  from: '2025-10-01'
  to: '2025-12-31'
comparison_options:
  numeric_tolerance:
    mode: absolute
    value: 0.001
  strings:
    trim: false
    case_sensitive: true
    empty_string_equals_null: false
  sample:
    max_problem_rows: 10
  values:
    show_values: true
    mask_sensitive_values: false
execution:
  query_timeout_seconds: 900
provider_options:
  dry_run_before_execute: true
  maximum_bytes_billed_gb: 25.0
  stop_if_dry_run_exceeds_limit: true
tags:
- linkidin_ads
